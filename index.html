
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Férias da Lari! 🌴</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: linear-gradient(135deg, #f9d5e5, #c5e9f5);
  color: #49364b;
}

.background {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 1.5s ease;
}

.background.visible { opacity: 1; }

.shade {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.48);
}

.card {
  position: relative;
  z-index: 2;
  width: min(88%, 430px);
  padding: 22px 14px;
  text-align: center;
  border-radius: 22px;
  background: rgba(255,255,255,0.48);
  backdrop-filter: blur(3px);
  box-shadow: 0 5px 20px rgba(0,0,0,0.10);
}
}

h1 {
  font-size: clamp(32px, 8vw, 48px);
  margin: 0 0 12px;
  color: #d45d91;
}

.subtitle {
  font-size: 18px;
  margin-bottom: 28px;
}

.countdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.unit {
  background: #fce4ef;
  border-radius: 15px;
  padding: 15px 5px;
}

.number {
  display: block;
  font-size: clamp(25px, 7vw, 36px);
  font-weight: bold;
  color: #b94f82;
}

.caption {
  font-size: 12px;
  margin-top: 5px;
}

.message {
  margin-top: 25px;
  font-size: 17px;
}

#photoStatus {
  margin-top: 12px;
  font-size: 11px;
  opacity: 0.65;
}
</style>
</head>

<body>

<div class="background visible" id="bg1"></div>
<div class="background" id="bg2"></div>
<div class="shade"></div>

<main class="card">
  <h1>Férias da Lari! 🌴</h1>
  <div class="subtitle">A contagem regressiva começou! ☀️</div>

  <div class="countdown">
    <div class="unit">
      <span class="number" id="days">0</span>
      <div class="caption">DIAS</div>
    </div>
    <div class="unit">
      <span class="number" id="hours">0</span>
      <div class="caption">HORAS</div>
    </div>
    <div class="unit">
      <span class="number" id="minutes">0</span>
      <div class="caption">MINUTOS</div>
    </div>
    <div class="unit">
      <span class="number" id="seconds">0</span>
      <div class="caption">SEGUNDOS</div>
    </div>
  </div>

  <div class="message">Está chegando a hora de aproveitar! 🏖️🍹</div>
  <div id="photoStatus">Preparando as fotos... 📸</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://vquqvwsedzobnxmnaooy.supabase.co";
const SUPABASE_KEY = "sb_publishable_33vPkj124IEgwVYua-t8gg_kzwoDTj2";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// Contagem regressiva até 10 de novembro de 2026
const targetDate = new Date("2026-11-10T00:00:00-03:00").getTime();

function updateCountdown() {
  const distance = targetDate - Date.now();

  if (distance <= 0) {
    document.getElementById("days").textContent = "0";
    document.getElementById("hours").textContent = "0";
    document.getElementById("minutes").textContent = "0";
    document.getElementById("seconds").textContent = "0";
    document.querySelector(".message").textContent =
      "Chegaram as férias! Aproveite muito! 🏝️❤️";
    return;
  }

  document.getElementById("days").textContent =
    Math.floor(distance / 86400000);
  document.getElementById("hours").textContent =
    Math.floor((distance % 86400000) / 3600000);
  document.getElementById("minutes").textContent =
    Math.floor((distance % 3600000) / 60000);
  document.getElementById("seconds").textContent =
    Math.floor((distance % 60000) / 1000);
}

updateCountdown();
setInterval(updateCountdown, 1000);

// Carrega e alterna as fotos do Supabase
async function loadPhotos() {
  const status = document.getElementById("photoStatus");

  try {
    const { data, error } = await client
      .storage
      .from("ferias-lari")
      .list("", { limit: 100 });

    if (error) throw error;

    const photos = (data || [])
      .filter(file =>
        file.name &&
        /\.(jpg|jpeg|png|webp|gif)$/i.test(file.name)
      )
      .map(file =>
        client.storage
          .from("ferias-lari")
          .getPublicUrl(file.name).data.publicUrl
      );

    if (photos.length === 0) {
      status.textContent = "Nenhuma foto encontrada.";
      return;
    }

    let current = 0;
    let showingFirst = true;

    const bg1 = document.getElementById("bg1");
    const bg2 = document.getElementById("bg2");

    function changePhoto() {
      const next = new Image();

      next.onload = () => {
        const active = showingFirst ? bg1 : bg2;
        const inactive = showingFirst ? bg2 : bg1;

        inactive.style.backgroundImage =
          `url("${photos[current]}")`;

        inactive.classList.add("visible");
        active.classList.remove("visible");

        showingFirst = !showingFirst;
        current = (current + 1) % photos.length;
      };

      next.onerror = () => {
        current = (current + 1) % photos.length;
      };

      next.src = photos[current];
    }

    changePhoto();
    setInterval(changePhoto, 5000);

    status.textContent = photos.length + " foto(s) carregada(s) ❤️";

  } catch (error) {
    console.error(error);
    status.textContent = "Não foi possível carregar as fotos.";
  }
}

loadPhotos();
</script>

</body>
</html>
